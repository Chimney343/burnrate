[project]
name = "burnrate"
version = "0.1.0"
description = "Download and backup all your Garmin Connect data locally"
authors = [
    {name = "Chimney343",email = "mk.kominek@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab (>=4.5.3,<5.0.0)",
    "garminconnect (>=0.2.38,<1.0.0)",
    "garth (>=0.2.0,<1.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "tqdm (>=4.66.0,<5.0.0)",
    "google-cloud-bigquery (>=3.0.0,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.5.2,<7.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "ipython (>=9.9.0,<10.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.5.2,<8.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=7.4.0,<8.0.0)",
    "pytest-mock (>=3.11.1,<4.0.0)",
    "pytest-cov (>=4.1.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.11.1"
pytest-cov = "^4.1.0"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/__pycache__/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
