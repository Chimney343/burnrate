[project]
name = "burnrate"
version = "0.1.0"
description = "Download and backup all your Garmin Connect data locally"
authors = [
    {name = "Chimney343",email = "mk.kominek@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab (>=4.5.2,<5.0.0)",
    "garminconnect (>=0.2.38,<1.0.0)",
    "garth (>=0.2.0,<1.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "tqdm (>=4.66.0,<5.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=7.4.0,<8.0.0)",
    "pytest-mock (>=3.11.1,<4.0.0)",
    "pytest-cov (>=4.1.0,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.11.1"
pytest-cov = "^4.1.0"

[tool.poetry]
package-mode = false
